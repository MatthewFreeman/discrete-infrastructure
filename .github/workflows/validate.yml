name: Validate infrastructure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload validated source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error

      - name: Validate Debian reboot and external scan guidance
        run: |
          set -euo pipefail
          runbook='docs/bootstrap-from-zero.md'

          reboot_line="$(grep -nF '## 11. Reboot validation' "${runbook}" | cut -d: -f1)"
          scan_line="$(grep -nF '## 12. Run an external IPv4 scan' "${runbook}" | cut -d: -f1)"
          updates_line="$(grep -nF '## 13. Normal future updates' "${runbook}" | cut -d: -f1)"
          targeted_line="$(grep -nF 'nmap -Pn -4 -p 22,22822,9330-9332 <VPS_IPV4>' "${runbook}" | cut -d: -f1)"
          full_line="$(grep -nF 'nmap -Pn -4 -p- --stats-every 30s <VPS_IPV4>' "${runbook}" | cut -d: -f1)"

          test "${reboot_line}" -lt "${scan_line}"
          test "${scan_line}" -lt "${updates_line}"
          test "${targeted_line}" -lt "${full_line}"

          reboot_section="$(awk '/^## 11\. Reboot validation$/{capture=1} /^## 12\. Run an external IPv4 scan$/{capture=0} capture' "${runbook}")"
          scan_section="$(awk '/^## 12\. Run an external IPv4 scan$/{capture=1} /^## 13\. Normal future updates$/{capture=0} capture' "${runbook}")"

          printf '%s\n' "${reboot_section}" | grep -Fx 'reboot'
          printf '%s\n' "${reboot_section}" | grep -F 'bash bootstrap/run.sh status'
          printf '%s\n' "${reboot_section}" | grep -F './scripts/audit-ports.sh'
          printf '%s\n' "${reboot_section}" | grep -F 'ss -6 -H -lntup'

          printf '%s\n' "${scan_section}" | grep -F 'required external check for every newly bootstrapped VPS'
          printf '%s\n' "${scan_section}" | grep -F 'not a per-VPS bootstrap requirement'
          printf '%s\n' "${scan_section}" | grep -F '65,535-port scan'
          printf '%s\n' "${scan_section}" | grep -F 'an hour or longer'
          printf '%s\n' "${scan_section}" | grep -F -- '--stats-every 30s'
          printf '%s\n' "${scan_section}" | grep -F -- '--min-rate'
          printf '%s\n' "${scan_section}" | grep -F -- '--max-retries'
          printf '%s\n' "${scan_section}" | grep -F 'incomplete scan is not a passing qualification result'
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y fail2ban nftables openssh-server shellcheck

      - name: Validate Bash syntax
        id: bash_syntax
        continue-on-error: true
        run: |
          set -o pipefail
          {
            while IFS= read -r -d '' file; do
              echo "bash -n ${file}"
              bash -n "${file}"
            done < <(find . -type f -name '*.sh' -print0 | sort -z)
          } 2>&1 | tee bash-syntax.txt

      - name: Run ShellCheck on managed entrypoints
        id: shellcheck
        continue-on-error: true
        run: |
          set -o pipefail
          shellcheck \
            bootstrap/run.sh \
            bootstrap/debian-ipv4.sh \
            bootstrap/create-admin.sh \
            install.sh \
            scripts/apply-config.sh \
            scripts/apply-nftables.sh \
            scripts/audit-ports.sh \
            scripts/configure-ipv4-only.sh \
            scripts/configure-time-sync.sh \
            scripts/check-ipv6-listeners.sh \
            scripts/restart-fail2ban.sh \
            scripts/verify.sh \
            2>&1 | tee shellcheck.txt

      - name: Test IPv6 listener migration classification
        id: ipv6_listener_migration
        continue-on-error: true
        run: |
          set -o pipefail
          {
            fixture_root="${RUNNER_TEMP}/ipv6-listener-fixtures"
            mkdir -p "${fixture_root}"

            : > "${fixture_root}/empty"
            printf '%s\n' \
              'tcp LISTEN 0 128 [::1]:6010 [::]:* users:(("sshd",pid=943,fd=5))' \
              > "${fixture_root}/x11-loopback"
            printf '%s\n' \
              'tcp LISTEN 0 128 [::]:6010 [::]:* users:(("sshd",pid=943,fd=5))' \
              > "${fixture_root}/x11-wildcard"
            printf '%s\n' \
              'udp UNCONN 0 0 [::1]:123 [::]:* users:(("ntpd",pid=804,fd=16))' \
              > "${fixture_root}/udp-loopback"
            printf '%s\n' \
              'tcp LISTEN 0 128 [::1]:6010 [::]:* users:(("other",pid=100,fd=5))' \
              > "${fixture_root}/non-sshd"

            test "$(
              DISCRETE_IPV6_LISTENERS_FILE="${fixture_root}/empty" \
                bash scripts/check-ipv6-listeners.sh prepare
            )" = 'none'

            test "$(
              DISCRETE_IPV6_LISTENERS_FILE="${fixture_root}/x11-loopback" \
                bash scripts/check-ipv6-listeners.sh prepare
            )" = 'transient-x11'

            if DISCRETE_IPV6_LISTENERS_FILE="${fixture_root}/x11-loopback" \
              bash scripts/check-ipv6-listeners.sh strict; then
              echo 'Strict mode accepted an IPv6 X11 listener.' >&2
              exit 1
            fi

            for fixture in x11-wildcard udp-loopback non-sshd; do
              if DISCRETE_IPV6_LISTENERS_FILE="${fixture_root}/${fixture}" \
                bash scripts/check-ipv6-listeners.sh prepare; then
                echo "Prepare mode accepted forbidden fixture: ${fixture}" >&2
                exit 1
              fi
            done

            grep -A3 -F 'nftables-bootstrap)' scripts/verify.sh \
              | grep -F 'verify_ipv4_prepare'
            grep -A3 -F 'fail2ban-bootstrap)' scripts/verify.sh \
              | grep -F 'verify_ipv4_prepare'
            grep -A6 -F 'verify_all_final()' scripts/verify.sh \
              | grep -F 'verify_ipv4_only'
          } 2>&1 | tee ipv6-listener-migration.txt

      - name: Test grouped component application
        id: component_apply
        continue-on-error: true
        run: |
          set -o pipefail
          {
            test_root="${RUNNER_TEMP}/component-apply"
            source_root="${GITHUB_WORKSPACE}/.ci-component-apply"
            success_root="${test_root}/success"
            rollback_root="${test_root}/rollback"

            rm -rf "${test_root}" "${source_root}"
            mkdir -p \
              "${source_root}" \
              "${success_root}/targets" \
              "${success_root}/backups" \
              "${rollback_root}/targets" \
              "${rollback_root}/backups"

            printf 'one\n' > "${source_root}/one"
            printf 'two\n' > "${source_root}/two"

            success_log="${success_root}/commands.log"
            success_manifest="${success_root}/manifest.tsv"
            success_output="${success_root}/output.txt"

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              'demo' \
              '.ci-component-apply/one' \
              "${success_root}/targets/one" \
              '0644' \
              "echo validate >> ${success_log}" \
              "echo reload >> ${success_log}" \
              "echo verify >> ${success_log}" \
              > "${success_manifest}"

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              'demo' \
              '.ci-component-apply/two' \
              "${success_root}/targets/two" \
              '0644' \
              "echo validate >> ${success_log}" \
              "echo reload >> ${success_log}" \
              "echo verify >> ${success_log}" \
              >> "${success_manifest}"

            sudo env \
              DISCRETE_MANIFEST="${success_manifest}" \
              DISCRETE_BACKUP_ROOT="${success_root}/backups" \
              bash scripts/apply-config.sh all \
              | tee "${success_output}"

            test "$(grep -c '^validate$' "${success_log}")" -eq 1
            test "$(grep -c '^reload$' "${success_log}")" -eq 1
            test "$(grep -c '^verify$' "${success_log}")" -eq 1
            grep -x 'Applied components: 1' "${success_output}"
            cmp "${source_root}/one" "${success_root}/targets/one"
            cmp "${source_root}/two" "${success_root}/targets/two"

            printf 'old-one\n' > "${rollback_root}/targets/one"
            printf 'old-two\n' > "${rollback_root}/targets/two"

            rollback_manifest="${rollback_root}/manifest.tsv"
            rollback_output="${rollback_root}/output.txt"
            rollback_log="${rollback_root}/commands.log"

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              'demo' \
              '.ci-component-apply/one' \
              "${rollback_root}/targets/one" \
              '0644' \
              'false' \
              "echo reload >> ${rollback_log}" \
              'true' \
              > "${rollback_manifest}"

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              'demo' \
              '.ci-component-apply/two' \
              "${rollback_root}/targets/two" \
              '0644' \
              'false' \
              "echo reload >> ${rollback_log}" \
              'true' \
              >> "${rollback_manifest}"

            if sudo env \
              DISCRETE_MANIFEST="${rollback_manifest}" \
              DISCRETE_BACKUP_ROOT="${rollback_root}/backups" \
              bash scripts/apply-config.sh all \
              > "${rollback_output}" 2>&1; then
              echo 'Rollback test unexpectedly succeeded.' >&2
              exit 1
            fi

            grep -x 'old-one' "${rollback_root}/targets/one"
            grep -x 'old-two' "${rollback_root}/targets/two"
            test ! -e "${rollback_log}"
            grep -F 'Rolling back component: demo' "${rollback_output}"
          } 2>&1 | tee component-apply.txt

      - name: Validate OpenSSH configuration
        id: openssh
        continue-on-error: true
        run: |
          set -o pipefail
          {
            sudo mkdir -p /run/sshd
            sudo sshd -t -f configs/ssh/00-discrete.conf
            sudo sshd -T -f configs/ssh/00-discrete.conf | grep -x 'addressfamily inet'
          } 2>&1 | tee openssh.txt

      - name: Validate nftables configuration
        id: nftables
        continue-on-error: true
        run: |
          set -o pipefail
          {
            sudo nft --check --file configs/nftables/nftables.conf
            grep -Eq '^table ip discrete_filter' configs/nftables/nftables.conf
            ! grep -Eq 'ipv6|ip6|table inet' configs/nftables/nftables.conf
          } 2>&1 | tee nftables.txt

      - name: Validate Fail2Ban configuration
        id: fail2ban
        continue-on-error: true
        run: |
          set -o pipefail
          {
            sudo install -m 0644 configs/fail2ban/fail2ban.local /etc/fail2ban/fail2ban.local
            sudo install -m 0644 configs/fail2ban/jail.local /etc/fail2ban/jail.local
            sudo fail2ban-client -t
            grep -Eq '^allowipv6 = no$' configs/fail2ban/fail2ban.local
            grep -F 'table_family=ip' configs/fail2ban/jail.local
          } 2>&1 | tee fail2ban.txt

      - name: Validate IPv4-only policy contract
        id: ipv4_contract
        continue-on-error: true
        run: |
          set -o pipefail
          {
            grep -Eq '^net.ipv6.conf.all.disable_ipv6 = 1$' configs/sysctl/99-discrete-ipv4-only.conf
            grep -Eq '^net.ipv6.conf.default.disable_ipv6 = 1$' configs/sysctl/99-discrete-ipv4-only.conf
            grep -Eq '^net.ipv6.conf.lo.disable_ipv6 = 1$' configs/sysctl/99-discrete-ipv4-only.conf
            grep -F $'nft list table ip discrete_filter' configs/manifest.tsv
          } 2>&1 | tee ipv4-contract.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            bash-syntax.txt
            shellcheck.txt
            component-apply.txt
            ipv6-listener-migration.txt
            openssh.txt
            nftables.txt
            fail2ban.txt
            ipv4-contract.txt
          if-no-files-found: error

      - name: Enforce validation results
        if: always()
        run: |
          test '${{ steps.bash_syntax.outcome }}' = 'success'
          test '${{ steps.shellcheck.outcome }}' = 'success'
          test '${{ steps.component_apply.outcome }}' = 'success'
          test '${{ steps.ipv6_listener_migration.outcome }}' = 'success'
          test '${{ steps.openssh.outcome }}' = 'success'
          test '${{ steps.nftables.outcome }}' = 'success'
          test '${{ steps.fail2ban.outcome }}' = 'success'
          test '${{ steps.ipv4_contract.outcome }}' = 'success'
