name: Apply X11 documentation clarification

on:
  push:
    branches:
      - docs/clarify-x11-banner-source
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/clarify-x11-banner-source

      - name: Clarify where the prepare X11 status is reported
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/bootstrap-from-zero.md')
          text = path.read_text(encoding='utf-8')

          old_step4 = '''`IPv6 listeners` may instead show:

```text
IPv6 listeners:        transient loopback X11; close original session before finalize
```

Do not run `finalize` yet.
'''
          new_step4 = '''`IPv6 listeners` may instead show:

```text
IPv6 listeners:        transient loopback X11; close original session before finalize
```

Look for this line in the final `PREPARE PHASE COMPLETE` banner printed in the original root
terminal where step 4 ran `bash bootstrap/run.sh prepare`. The fresh login commands in step 6 do
not print this status. If the line appears, note it but do not close the original root session yet.
Continue to step 6, verify both fresh SSH paths, and then follow the X11 cleanup instructions there.

Do not run `finalize` yet.
'''

          old_step6 = '''If `prepare` reported a transient `[::1]:60xx` X11 listener, keep the fresh administrative
session open, close the original root session, and verify from the fresh session:

```bash
ss -6 -H -lntup
```

Expected output: none. New sessions cannot recreate the listener because the managed temporary
SSH configuration already sets `X11Forwarding no`. Do not run `finalize` while the original
X11-enabled session is still open.
'''
          new_step6 = '''Return to the final `PREPARE PHASE COMPLETE` banner in the original root terminal used in
step 4. Only if its `IPv6 listeners:` line reported:

```text
IPv6 listeners:        transient loopback X11; close original session before finalize
```

keep the fresh `serveradmin` session open, close the original root session, and verify from the
fresh administrative session:

```bash
ss -6 -H -lntup
```

Expected output: none. The transient listener would have been an `sshd` X11 listener on
`[::1]:6000` through `[::1]:6063` attached to the original session. New sessions cannot recreate
it because the managed temporary SSH configuration already sets `X11Forwarding no`. Do not run
`finalize` while the original X11-enabled session is still open.
'''

          if text.count(old_step4) != 1:
              raise SystemExit(f'Expected one step 4 block, found {text.count(old_step4)}')
          if text.count(old_step6) != 1:
              raise SystemExit(f'Expected one step 6 block, found {text.count(old_step6)}')

          text = text.replace(old_step4, new_step4, 1)
          text = text.replace(old_step6, new_step6, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -F 'final `PREPARE PHASE COMPLETE` banner printed in the original root' docs/bootstrap-from-zero.md
          grep -F 'The fresh login commands in step 6 do' docs/bootstrap-from-zero.md
          grep -F '`[::1]:6000` through `[::1]:6063`' docs/bootstrap-from-zero.md

      - name: Commit documentation change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/bootstrap-from-zero.md
          git commit -m 'Clarify source of prepare X11 status'
          git push origin HEAD:docs/clarify-x11-banner-source
