name: Validate Ubuntu 24.04 platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-platform:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Validate Ubuntu Bash syntax
        run: |
          bash -n bootstrap/run-ubuntu-24.04.sh
          bash -n bootstrap/ubuntu-24.04-ipv4.sh
          bash -n bootstrap/install-ubuntu-ipv4-reassertion.sh
          bash -n install-ubuntu-24.04.sh

      - name: Run ShellCheck on Ubuntu entrypoints
        id: shellcheck
        continue-on-error: true
        run: |
          set -o pipefail
          shellcheck -x \
            bootstrap/run-ubuntu-24.04.sh \
            bootstrap/ubuntu-24.04-ipv4.sh \
            bootstrap/install-ubuntu-ipv4-reassertion.sh \
            install-ubuntu-24.04.sh \
            2>&1 | tee shellcheck-ubuntu.txt

      - name: Upload Ubuntu ShellCheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-shellcheck-diagnostics
          path: shellcheck-ubuntu.txt
          if-no-files-found: error

      - name: Enforce Ubuntu ShellCheck result
        run: |
          test '${{ steps.shellcheck.outcome }}' = 'success'

      - name: Validate Ubuntu platform contract
        run: |
          bash -c 'source bootstrap/ubuntu-24.04-ipv4.sh; check_platform'

          fixture="${RUNNER_TEMP}/debian-os-release"
          cat > "${fixture}" <<'EOF'
          ID=debian
          VERSION_ID="12"
          EOF

          if UBUNTU_OS_RELEASE_FILE="${fixture}" \
            bash -c 'source bootstrap/ubuntu-24.04-ipv4.sh; check_platform'; then
            echo 'Ubuntu entrypoint accepted Debian 12.' >&2
            exit 1
          fi

      - name: Validate Ubuntu access-mode contract
        run: |
          test "$(
            BOOTSTRAP_SOURCE_USER=ubuntu \
              bash -c 'source bootstrap/ubuntu-24.04-ipv4.sh; ubuntu_temporary_root_login_policy'
          )" = 'no'

          test "$(
            env -u BOOTSTRAP_SOURCE_USER \
              bash -c 'source bootstrap/ubuntu-24.04-ipv4.sh; ubuntu_temporary_root_login_policy'
          )" = 'yes'

          grep -F 'PermitRootLogin ${permit_root_login}' \
            bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'authorized_keys directly to ${ADMIN_USER}' \
            bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'root account remains locked' \
            docs/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'ssh -4 -o ForwardX11=no -p 22 <INITIAL_USER>@<VPS_IPV4>' \
            docs/bootstrap-ubuntu-24.04-from-zero.md

      - name: Validate Ubuntu finalize IPv6 preflight
        run: |
          bash -c '
            source bootstrap/ubuntu-24.04-ipv4.sh
            verify_no_ipv6_listener() { return 0; }
            ADMIN_SSH_CONFIRMED=1 confirm_admin_ssh_test
          '

          blocked_output="${RUNNER_TEMP}/ubuntu-finalize-preflight.txt"
          if bash -c '
            source bootstrap/ubuntu-24.04-ipv4.sh
            verify_no_ipv6_listener() { return 1; }
            ss() { printf "%s\n" "tcp LISTEN 0 128 [::1]:6010 [::]:* users:((\"sshd\",pid=1222,fd=5))"; }
            ADMIN_SSH_CONFIRMED=1 confirm_admin_ssh_test
          ' >"${blocked_output}" 2>&1; then
            echo 'Ubuntu finalize preflight accepted an IPv6 listener.' >&2
            exit 1
          fi

          grep -F 'Ubuntu finalize preflight found active IPv6 listeners.' "${blocked_output}"
          grep -F 'Temporary SSH access was not changed.' "${blocked_output}"

      - name: Validate Ubuntu reboot persistence contract
        run: |
          test -x install-ubuntu-24.04.sh
          test -f configs/systemd/discrete-ipv4-only-after-network.service
          test -f bootstrap/install-ubuntu-ipv4-reassertion.sh

          grep -F 'After=network-online.target' \
            configs/systemd/discrete-ipv4-only-after-network.service
          grep -F 'ExecStart=/bin/bash /opt/discrete-infrastructure/scripts/configure-ipv4-only.sh' \
            configs/systemd/discrete-ipv4-only-after-network.service
          grep -F 'WantedBy=multi-user.target' \
            configs/systemd/discrete-ipv4-only-after-network.service
          if grep -F 'install-ubuntu-ipv4-reassertion.sh' \
            bootstrap/run-ubuntu-24.04.sh; then
            echo 'Ubuntu runner mutates reboot persistence before repository preflight.' >&2
            exit 1
          fi
          grep -F 'verify_repository_preflight' \
            bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'install-ubuntu-ipv4-reassertion.sh' \
            bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'UBUNTU_IPV4_SERVICE_START_NOW=1' \
            install-ubuntu-24.04.sh
          grep -F 'systemctl enable "${UNIT_NAME}"' \
            bootstrap/install-ubuntu-ipv4-reassertion.sh

      - name: Validate Ubuntu external scan guidance
        run: |
          scan_doc="$(
            awk '/^## 12\. Run an external IPv4 scan$/,/^## 13\./' \
              docs/bootstrap-ubuntu-24.04-from-zero.md
          )"
          targeted_scan='nmap -Pn -4 -p 22,22822,9330-9332 <VPS_IPV4>'
          fast_scan='nmap -Pn -4 -T4 --min-rate 500 --max-retries 2 -p- --stats-every 15s <VPS_IPV4>'
          full_scan='nmap -Pn -4 -p- --stats-every 30s <VPS_IPV4>'

          grep -F "${targeted_scan}" <<<"${scan_doc}"
          grep -F "${fast_scan}" <<<"${scan_doc}"
          grep -F "${full_scan}" <<<"${scan_doc}"
          grep -F 'required external check for every newly bootstrapped VPS' <<<"${scan_doc}"
          grep -F 'not a per-VPS bootstrap requirement' <<<"${scan_doc}"
          grep -F 'Optional fast all-port confidence check' <<<"${scan_doc}"
          grep -F 'supplemental evidence only' <<<"${scan_doc}"
          grep -F 'Accuracy-first qualification scan' <<<"${scan_doc}"
          grep -F '65,535-port scan' <<<"${scan_doc}"
          grep -F 'may take from several minutes to an hour or longer' <<<"${scan_doc}"
          grep -F -- '--min-rate' <<<"${scan_doc}"
          grep -F -- '--max-retries' <<<"${scan_doc}"
          grep -F 'incomplete scan is not a passing qualification result' <<<"${scan_doc}"

          targeted_line="$(grep -nF "${targeted_scan}" <<<"${scan_doc}" | cut -d: -f1)"
          fast_line="$(grep -nF "${fast_scan}" <<<"${scan_doc}" | cut -d: -f1)"
          full_line="$(grep -nF "${full_scan}" <<<"${scan_doc}" | cut -d: -f1)"
          (( targeted_line < fast_line && fast_line < full_line )) || {
            echo 'Scan order must be targeted, optional fast sweep, then qualification.' >&2
            exit 1
          }

      - name: Validate Ubuntu support status
        run: |
          grep -F 'Supported and clean-room validated via Path A; Path B experimental' README.md
          grep -F 'Supported and clean-room validated via Path A; Path B experimental' docs/bootstrap-platforms.md
          grep -F '**Support status:** Path A is supported and clean-room validated.' docs/bootstrap-ubuntu-24.04-from-zero.md
          grep -F '# Path A clean-room validation record' docs/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'Path B remains experimental' docs/bootstrap-ubuntu-24.04-from-zero.md
      - name: Validate platform file separation
        run: |
          grep -F 'ubuntu-24.04-ipv4.sh' bootstrap/run-ubuntu-24.04.sh
          grep -F 'bootstrap/run-ubuntu-24.04.sh' docs/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'install-ubuntu-24.04.sh' docs/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'bootstrap/run.sh' docs/bootstrap-platforms.md
          grep -F 'bootstrap/run-ubuntu-24.04.sh' docs/bootstrap-platforms.md

          test -f docs/bootstrap-from-zero.md
          test -f bootstrap/run.sh
          test -f bootstrap/debian-ipv4.sh
          test -f install.sh
