name: Test bootstrap status semantics

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  expected-absence:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply X11 documentation clarification
        if: github.ref == 'refs/heads/docs/clarify-x11-banner-source' && github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PYDOC'
          from pathlib import Path

          path = Path('docs/bootstrap-from-zero.md')
          text = path.read_text(encoding='utf-8')

          old_step4 = """`IPv6 listeners` may instead show:

```text
IPv6 listeners:        transient loopback X11; close original session before finalize
```

Do not run `finalize` yet.
"""
          new_step4 = """`IPv6 listeners` may instead show:

```text
IPv6 listeners:        transient loopback X11; close original session before finalize
```

Look for this line in the final `PREPARE PHASE COMPLETE` banner printed in the original root
terminal where step 4 ran `bash bootstrap/run.sh prepare`. The fresh login commands in step 6 do
not print this status. If the line appears, note it but do not close the original root session yet.
Continue to step 6, verify both fresh SSH paths, and then follow the X11 cleanup instructions there.

Do not run `finalize` yet.
"""

          old_step6 = """If `prepare` reported a transient `[::1]:60xx` X11 listener, keep the fresh administrative
session open, close the original root session, and verify from the fresh session:

```bash
ss -6 -H -lntup
```

Expected output: none. New sessions cannot recreate the listener because the managed temporary
SSH configuration already sets `X11Forwarding no`. Do not run `finalize` while the original
X11-enabled session is still open.
"""
          new_step6 = """Return to the final `PREPARE PHASE COMPLETE` banner in the original root terminal used in
step 4. Only if its `IPv6 listeners:` line reported:

```text
IPv6 listeners:        transient loopback X11; close original session before finalize
```

keep the fresh `serveradmin` session open, close the original root session, and verify from the
fresh administrative session:

```bash
ss -6 -H -lntup
```

Expected output: none. The transient listener would have been an `sshd` X11 listener on
`[::1]:6000` through `[::1]:6063` attached to the original session. New sessions cannot recreate
it because the managed temporary SSH configuration already sets `X11Forwarding no`. Do not run
`finalize` while the original X11-enabled session is still open.
"""

          if text.count(old_step4) != 1 or text.count(old_step6) != 1:
              raise SystemExit('Expected X11 documentation blocks were not found exactly once')
          text = text.replace(old_step4, new_step4, 1).replace(old_step6, new_step6, 1)
          path.write_text(text, encoding='utf-8')
          PYDOC

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/bootstrap-from-zero.md
          git commit -m 'Clarify source of prepare X11 status'
          git push origin HEAD:docs/clarify-x11-banner-source

      - name: Validate expected-absence probes
        run: |
          set -Eeuo pipefail

          bash -n bootstrap/debian-ipv4.sh
          source bootstrap/debian-ipv4.sh

          nft() {
            return 1
          }

          assert_nft_table_absent \
            inet \
            f2b-table \
            'Fixture table unexpectedly exists.'

          if (
            nft() {
              return 0
            }
            assert_nft_table_absent \
              inet \
              f2b-table \
              'Fixture table exists.'
          ); then
            echo 'Expected-present nftables fixture was accepted.' >&2
            exit 1
          fi

          awk '/^install_bootstrap_fail2ban\(\)/,/^\)/' \
            bootstrap/debian-ipv4.sh \
            | grep -F 'return 0'

          awk '/^verify_no_ufw\(\)/,/^}/' \
            bootstrap/debian-ipv4.sh \
            | grep -F 'return 0'

      - name: Validate finalize root contract
        run: |
          set -Eeuo pipefail

          finalize_section="$(
            awk \
              '/^## 7\. Run the `finalize` phase$/,/^## 8\./' \
              docs/bootstrap-from-zero.md
          )"

          sudo_line="$(
            grep -n -F 'sudo -i' <<<"${finalize_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"
          finalize_line="$(
            grep -n -F 'bash bootstrap/run.sh finalize' <<<"${finalize_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"

          [[ "${sudo_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Runbook does not document sudo -i before finalize.' >&2; exit 1; }
          [[ "${finalize_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Runbook finalize command is missing.' >&2; exit 1; }
          (( sudo_line < finalize_line )) \
            || { echo 'Runbook invokes finalize before entering a root shell.' >&2; exit 1; }

          main_section="$(
            awk '/^main\(\) \{$/,/^}/' bootstrap/debian-ipv4.sh
          )"
          require_root_line="$(
            grep -n -F 'require_root' <<<"${main_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"
          dispatch_line="$(
            grep -n -F 'case "${1:-}" in' <<<"${main_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"

          [[ "${require_root_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Bootstrap entrypoint no longer requires root.' >&2; exit 1; }
          [[ "${dispatch_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Bootstrap phase dispatch is missing.' >&2; exit 1; }
          (( require_root_line < dispatch_line )) \
            || { echo 'Bootstrap checks root only after phase dispatch.' >&2; exit 1; }

      - name: Validate compact IPv6 audit output
        run: |
          set -Eeuo pipefail

          bash -n scripts/audit-ports.sh

          grep -F 'flags=(/proc/sys/net/ipv6/conf/*/disable_ipv6)' \
            scripts/audit-ports.sh
          grep -F 'for flag in "${flags[@]}"; do' \
            scripts/audit-ports.sh
          grep -F '[[ "${value}" == "1" ]]' \
            scripts/audit-ports.sh
          grep -F 'IPv6 is enabled on ${interface}' \
            scripts/audit-ports.sh
          grep -F 'IPv6 interface policy: all current and future interfaces disabled' \
            scripts/audit-ports.sh

          if grep -F "printf '%-18s %s" scripts/audit-ports.sh; then
            echo 'Audit still prints raw per-interface IPv6 flag rows.' >&2
            exit 1
          fi

      - name: Validate compact APT lock output
        run: |
          set -Eeuo pipefail

          bash -n bootstrap/run.sh
          source bootstrap/run.sh

          success_fixture="$(mktemp)"
          error_fixture="$(mktemp)"
          trap 'rm -f "${success_fixture}" "${error_fixture}"' EXIT

          cat >"${success_fixture}" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' 'Waiting for cache lock: fixture lock holder' >&2
          sleep 2
          printf '%s\n' 'Waiting for cache lock: fixture lock holder' >&2
          printf '%s\n' 'Waiting for cache lock: fixture lock holder' >&2
          printf '%s\n' 'Reading package lists... Done'
          EOF
          chmod +x "${success_fixture}"

          output="$(
            APT_GET_BIN="${success_fixture}" \
            APT_LOCK_TIMEOUT_SECONDS=5 \
            APT_LOCK_PROGRESS_SECONDS=1 \
              apt-get update
          )"

          initial_count="$(
            awk '
              $0 == "==> Package manager is busy; waiting up to 5 seconds" {
                count++
              }
              END { print count + 0 }
            ' <<<"${output}"
          )"
          [[ "${initial_count}" -eq 1 ]] \
            || { echo 'APT lock wait announcement was not emitted exactly once.' >&2; exit 1; }

          grep -F '==> Still waiting for package manager lock (' <<<"${output}"
          grep -F 'Reading package lists... Done' <<<"${output}"

          if grep -F 'Waiting for cache lock:' <<<"${output}"; then
            echo 'Raw repeated APT lock diagnostics leaked into output.' >&2
            exit 1
          fi

          cat >"${error_fixture}" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' 'E: fixture package failure' >&2
          exit 42
          EOF
          chmod +x "${error_fixture}"

          set +e
          error_output="$(
            APT_GET_BIN="${error_fixture}" \
              apt-get update 2>&1
          )"
          error_status=$?
          set -e

          [[ "${error_status}" -eq 42 ]] \
            || { echo "APT exit status changed to ${error_status}; expected 42." >&2; exit 1; }
          grep -F 'E: fixture package failure' <<<"${error_output}"
