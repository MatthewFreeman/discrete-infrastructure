name: Validate Ubuntu 24.04 platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-platform:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Validate Ubuntu Bash syntax
        run: |
          bash -n modules/host/bootstrap/run-ubuntu-24.04.sh
          bash -n modules/host/bootstrap/ubuntu-24.04-ipv4.sh
          bash -n modules/host/bootstrap/install-ubuntu-ipv4-reassertion.sh
          bash -n modules/host/install-ubuntu-24.04.sh

      - name: Run ShellCheck on Ubuntu entrypoints
        id: shellcheck
        continue-on-error: true
        run: |
          set -o pipefail
          shellcheck -x \
            modules/host/bootstrap/run-ubuntu-24.04.sh \
            modules/host/bootstrap/ubuntu-24.04-ipv4.sh \
            modules/host/bootstrap/install-ubuntu-ipv4-reassertion.sh \
            modules/host/install-ubuntu-24.04.sh \
            2>&1 | tee shellcheck-ubuntu.txt

      - name: Upload Ubuntu ShellCheck diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-shellcheck-diagnostics
          path: shellcheck-ubuntu.txt
          if-no-files-found: error

      - name: Enforce Ubuntu ShellCheck result
        run: |
          test '${{ steps.shellcheck.outcome }}' = 'success'

      - name: Validate Ubuntu platform contract
        run: |
          bash -c 'source modules/host/bootstrap/ubuntu-24.04-ipv4.sh; check_platform'

          fixture="${RUNNER_TEMP}/debian-os-release"
          cat > "${fixture}" <<'EOF'
          ID=debian
          VERSION_ID="12"
          EOF

          if UBUNTU_OS_RELEASE_FILE="${fixture}" \
            bash -c 'source modules/host/bootstrap/ubuntu-24.04-ipv4.sh; check_platform'; then
            echo 'Ubuntu entrypoint accepted Debian 12.' >&2
            exit 1
          fi

      - name: Validate Ubuntu access-mode contract
        run: |
          test "$(
            BOOTSTRAP_SOURCE_USER=ubuntu \
              bash -c 'source modules/host/bootstrap/ubuntu-24.04-ipv4.sh; ubuntu_temporary_root_login_policy'
          )" = 'no'

          test "$(
            env -u BOOTSTRAP_SOURCE_USER \
              bash -c 'source modules/host/bootstrap/ubuntu-24.04-ipv4.sh; ubuntu_temporary_root_login_policy'
          )" = 'yes'

          grep -F 'PermitRootLogin ${permit_root_login}' \
            modules/host/bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'authorized_keys directly to ${ADMIN_USER}' \
            modules/host/bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'root account remains locked' \
            docs/host/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'ssh -4 -o ForwardX11=no -p 22 <INITIAL_USER>@<VPS_IPV4>' \
            docs/host/bootstrap-ubuntu-24.04-from-zero.md

      - name: Validate Ubuntu finalize IPv6 preflight
        run: |
          bash -c '
            source modules/host/bootstrap/ubuntu-24.04-ipv4.sh
            verify_no_ipv6_listener() { return 0; }
            ADMIN_SSH_CONFIRMED=1 confirm_admin_ssh_test
          '

          blocked_output="${RUNNER_TEMP}/ubuntu-finalize-preflight.txt"
          if bash -c '
            source modules/host/bootstrap/ubuntu-24.04-ipv4.sh
            verify_no_ipv6_listener() { return 1; }
            ss() { printf "%s\n" "tcp LISTEN 0 128 [::1]:6010 [::]:* users:((\"sshd\",pid=1222,fd=5))"; }
            ADMIN_SSH_CONFIRMED=1 confirm_admin_ssh_test
          ' >"${blocked_output}" 2>&1; then
            echo 'Ubuntu finalize preflight accepted an IPv6 listener.' >&2
            exit 1
          fi

          grep -F 'Ubuntu finalize preflight found active IPv6 listeners.' "${blocked_output}"
          grep -F 'Temporary SSH access was not changed.' "${blocked_output}"

      - name: Validate Ubuntu reboot persistence contract
        run: |
          test -x modules/host/install-ubuntu-24.04.sh
          test -f modules/host/configs/systemd/discrete-ipv4-only-after-network.service
          test -f modules/host/bootstrap/install-ubuntu-ipv4-reassertion.sh

          grep -F 'After=network-online.target' \
            modules/host/configs/systemd/discrete-ipv4-only-after-network.service
          grep -F 'ExecStart=/bin/bash /opt/discrete-infrastructure/scripts/configure-ipv4-only.sh' \
            modules/host/configs/systemd/discrete-ipv4-only-after-network.service
          grep -F 'WantedBy=multi-user.target' \
            modules/host/configs/systemd/discrete-ipv4-only-after-network.service
          if grep -F 'install-ubuntu-ipv4-reassertion.sh' \
            modules/host/bootstrap/run-ubuntu-24.04.sh; then
            echo 'Ubuntu runner mutates reboot persistence before repository preflight.' >&2
            exit 1
          fi
          grep -F 'verify_repository_preflight' \
            modules/host/bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'install-ubuntu-ipv4-reassertion.sh' \
            modules/host/bootstrap/ubuntu-24.04-ipv4.sh
          grep -F 'UBUNTU_IPV4_SERVICE_START_NOW=1' \
            modules/host/install-ubuntu-24.04.sh
          grep -F 'systemctl enable "${UNIT_NAME}"' \
            modules/host/bootstrap/install-ubuntu-ipv4-reassertion.sh

      - name: Validate Ubuntu external scan guidance
        run: |
          scan_doc="$(
            awk '/^## 12\. Run an external IPv4 scan$/,/^## 13\./' \
              docs/host/bootstrap-ubuntu-24.04-from-zero.md
          )"
          targeted_scan='nmap -Pn -4 -p 22,22822,9330-9332 <VPS_IPV4>'

          grep -F "${targeted_scan}" <<<"${scan_doc}"
          grep -F 'required external check for every newly bootstrapped VPS' <<<"${scan_doc}"
          grep -F 'A full `-p-` scan is not part of bootstrap qualification.' <<<"${scan_doc}"
          grep -F 'local audit enumerates listeners' <<<"${scan_doc}"
          grep -F 'must not block routine bootstrap or release qualification' <<<"${scan_doc}"
          if grep -F 'nmap ' <<<"${scan_doc}" | grep -F -- '-p-'; then
            echo 'All-port Nmap commands must not be part of bootstrap qualification.' >&2
            exit 1
          fi

      - name: Validate Ubuntu support status
        run: |
          grep -F '| Ubuntu Server 24.04 LTS (noble) | Supported and clean-room validated |' README.md
          grep -F '| Ubuntu Server 24.04 LTS (noble) | Supported and clean-room validated |' docs/host/bootstrap-platforms.md
          grep -F '**Support status:** supported and clean-room validated.' docs/host/bootstrap-ubuntu-24.04-from-zero.md
          grep -F '# Clean-room validation record' docs/host/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'Path B-specific access-mode behavior' docs/host/bootstrap-ubuntu-24.04-from-zero.md
          ! grep -F 'Path B experimental' README.md docs/host/bootstrap-platforms.md
          ! grep -F 'Path B remains experimental' docs/host/bootstrap-ubuntu-24.04-from-zero.md
      - name: Validate platform file separation
        run: |
          grep -F 'ubuntu-24.04-ipv4.sh' modules/host/bootstrap/run-ubuntu-24.04.sh
          grep -F 'bootstrap/run-ubuntu-24.04.sh' docs/host/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'install-ubuntu-24.04.sh' docs/host/bootstrap-ubuntu-24.04-from-zero.md
          grep -F 'bootstrap/run.sh' docs/host/bootstrap-platforms.md
          grep -F 'bootstrap/run-ubuntu-24.04.sh' docs/host/bootstrap-platforms.md

          test -f docs/host/bootstrap-from-zero.md
          test -f modules/host/bootstrap/run.sh
          test -f modules/host/bootstrap/debian-ipv4.sh
          test -f modules/host/install.sh
