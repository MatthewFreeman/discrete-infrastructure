name: Pay persistent private test
on:
  push:
    branches: [main, codex/pay-operator-monitor]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.1'
      - run: python -B qualification/discrete-pay/test_persistent.py
      - run: node --check qualification/discrete-pay/persistent-probe.mjs
