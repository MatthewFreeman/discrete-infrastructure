name: Tighten public origin verification

on:
  push:
    branches:
      - public/anonymous-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q \
            --depth 1 \
            --branch public/anonymous-bootstrap \
            https://github.com/MatthewFreeman/discrete-infrastructure.git \
            .
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/MatthewFreeman/discrete-infrastructure.git"

      - name: Require canonical anonymous origin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bootstrap/debian-ipv4.sh')
          content = path.read_text(encoding='utf-8')
          old = '''    [[ "${origin}" =~ ^https://github\\.com/[^/]+/[^/]+(\\.git)?$ ]] \\
                  || die "Git origin must use public GitHub HTTPS: ${origin}"

              GIT_TERMINAL_PROMPT=0 git ls-remote "${origin}" HEAD >/dev/null 2>&1 \\
                  || die "Anonymous HTTPS access to Git origin failed: ${origin}"
          '''
          new = '''    case "${origin}" in
                  https://github.com/MatthewFreeman/discrete-infrastructure|https://github.com/MatthewFreeman/discrete-infrastructure.git)
                      ;;
                  *)
                      die "Git origin must be the canonical public repository: ${origin}"
                      ;;
              esac

              GIT_TERMINAL_PROMPT=0 git \\
                  -c credential.helper= \\
                  -c http.https://github.com/.extraheader= \\
                  ls-remote "${origin}" HEAD >/dev/null 2>&1 \\
                  || die "Anonymous HTTPS access to Git origin failed: ${origin}"
          '''
          if content.count(old) != 1:
              raise SystemExit('Expected public-origin verification block was not found exactly once.')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n bootstrap/debian-ipv4.sh
          grep -F 'Git origin must be the canonical public repository' bootstrap/debian-ipv4.sh
          grep -F -- '-c credential.helper=' bootstrap/debian-ipv4.sh
          grep -F -- '-c http.https://github.com/.extraheader=' bootstrap/debian-ipv4.sh

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/debian-ipv4.sh
          git commit -m 'Require canonical anonymous Git origin'
          git push origin HEAD:public/anonymous-bootstrap
