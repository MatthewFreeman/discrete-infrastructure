name: Apply X11 bootstrap listener fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix-x11-bootstrap-listener'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-x11-bootstrap-listener
          fetch-depth: 0

      - name: Install verified implementation files
        run: |
          cat > /tmp/x11-fix-files.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/x11-fix-files.b64 > /tmp/x11-fix-files.tar.gz
          tar -xzf /tmp/x11-fix-files.tar.gz
          chmod +x scripts/check-ipv6-listeners.sh
          bash -n bootstrap/debian-ipv4.sh scripts/verify.sh scripts/check-ipv6-listeners.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bootstrap/debian-ipv4.sh \
            scripts/verify.sh \
            scripts/check-ipv6-listeners.sh \
            .github/workflows/validate.yml
          git commit -m 'Handle transient SSH X11 listeners during prepare'
          git push origin fix-x11-bootstrap-listener

      - name: Remove one-time workflow
        run: |
          git pull --ff-only origin fix-x11-bootstrap-listener
          rm .github/workflows/apply-x11-bootstrap-fix.yml
          git add .github/workflows/apply-x11-bootstrap-fix.yml
          git commit -m 'Remove one-time X11 bootstrap workflow'
          git push origin fix-x11-bootstrap-listener
