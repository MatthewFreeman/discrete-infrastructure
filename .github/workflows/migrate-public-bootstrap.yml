name: Migrate bootstrap to public access

on:
  push:
    branches:
      - public/anonymous-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Clone migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q \
            --depth 1 \
            --branch public/anonymous-bootstrap \
            https://github.com/MatthewFreeman/discrete-infrastructure.git \
            .
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/MatthewFreeman/discrete-infrastructure.git"

      - name: Apply public repository migration
        id: migration
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/migrate-public-bootstrap.py 2>&1 | tee migration.log

      - name: Report migration failure
        if: steps.migration.outcome != 'success'
        run: |
          echo 'Migration failed. Final diagnostic:' >&2
          tail -n 30 migration.log >&2
          exit 1

      - name: Validate generated shell and documentation state
        run: |
          bash -n bootstrap/debian-ipv4.sh
          bash -n bootstrap/ubuntu-24.04-ipv4.sh
          bash -n bootstrap/run.sh
          bash -n bootstrap/run-ubuntu-24.04.sh

          test ! -e docs/create-github-access-token.md
          grep -F 'verify_public_repository_access()' bootstrap/debian-ipv4.sh
          grep -F 'Repository access:     public anonymous HTTPS' bootstrap/debian-ipv4.sh

      - name: Commit migration result
        run: |
          # The GitHub Actions token has contents:write but not workflows:write.
          # Add the permanent validation workflow separately through the GitHub app.
          rm -f .github/workflows/validate-public-access.yml

          if git diff --quiet && git diff --cached --quiet; then
            echo 'Migration produced no changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove private GitHub bootstrap authentication'
          git push origin HEAD:public/anonymous-bootstrap
