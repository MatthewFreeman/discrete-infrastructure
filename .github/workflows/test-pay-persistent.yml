name: Pay persistent private test
on:
  push:
    branches: [main, dev/pay-operator-monitor, dev/pay-standalone-installer]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.1'
      - run: python -B qualification/discrete-pay/test_persistent.py
      - run: python -B qualification/discrete-pay/test_persistent_upgrade.py
      - run: python -B services/discrete-pay/test_install.py
      - run: python -B qualification/discrete-pay/test_bundle.py
      - run: python -B qualification/discrete-pay/test_combined_sequence.py
      - run: node --check qualification/discrete-pay/gui-uri-session.mjs
      - run: node --check qualification/discrete-pay/standalone-probe.mjs
      - run: node --check qualification/discrete-pay/release-compatibility.mjs
      - run: node --check qualification/discrete-pay/persistent-probe.mjs
      - run: node --check qualification/discrete-pay/paged-native-load.mjs
      - run: node --check qualification/discrete-pay/combined-native-journal.mjs
      - run: node --test qualification/discrete-pay/registry-prefix.test.mjs
