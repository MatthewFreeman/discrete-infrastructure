name: Validate modular repository layout

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-layout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable GitHub Action references
        run: python3 .github/scripts/validate-action-pins.py

      - name: Validate canonical paths and compatibility entrypoints
        run: bash .github/scripts/validate-layout.sh

      - name: Validate repository-local Markdown links
        run: python3 .github/scripts/validate-markdown-links.py
