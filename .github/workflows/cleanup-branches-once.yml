name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete temporary branches
        run: |
          set -Eeuo pipefail

          branches=(
            ipv4-readme-validation
            noop
            grouped-component-apply
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting origin/${branch}"
              git push origin --delete "${branch}"
            else
              echo "Already absent: origin/${branch}"
            fi
          done

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Branch still exists after cleanup: origin/${branch}" >&2
              exit 1
            fi
          done

      - name: Remove one-time workflow
        run: |
          set -Eeuo pipefail

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-branches-once.yml
          git commit -m "Remove one-time branch cleanup workflow"
          git push origin HEAD:main
