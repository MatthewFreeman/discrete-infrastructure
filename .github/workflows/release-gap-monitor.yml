name: Monitor canonical release and deployment gaps

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gap-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build canonical release and deployment report
        id: monitor
        env:
          GH_TOKEN: ${{ secrets.DISCRETE_MONITOR_TOKEN }}
        run: node monitoring/release-gap/monitor.mjs --fail-on-gap=false

      - name: Upload machine-readable and Markdown reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gap-report
          path: |
            release-gap-report.json
            release-gap-report.md
          if-no-files-found: error

      - name: Action required - release or deployment gaps detected
        if: steps.monitor.outputs.actionable_count != '0'
        env:
          ACTIONABLE_COUNT: ${{ steps.monitor.outputs.actionable_count }}
        run: |
          echo "::error title=Release/deployment gaps detected::Monitor completed successfully and found ${ACTIONABLE_COUNT} actionable gap(s). Open the job summary for exact repositories, commits, and evidence."
          exit 1
