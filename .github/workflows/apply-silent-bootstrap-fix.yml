name: Apply silent bootstrap fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix-silent-bootstrap-exit'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-silent-bootstrap-exit
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit documentation contract first
        run: |
          set -euxo pipefail
          { cat .ci-fixes/docs-status.patch; printf '\n'; } \
            | patch --batch --forward -p1
          git diff --check
          git add docs/bootstrap-from-zero.md
          git commit -m 'Document explicit bootstrap phase status'

      - name: Commit bootstrap implementation fix
        run: |
          set -euxo pipefail
          temporary_patch="${RUNNER_TEMP}/bootstrap-status.patch"
          awk '/^--- a\/\.github\/workflows\/validate\.yml$/ { exit } { print }' \
            .ci-fixes/implementation-status.patch > "${temporary_patch}"
          printf '\n' >> "${temporary_patch}"
          patch --batch --forward -p1 < "${temporary_patch}"
          bash -n bootstrap/debian-ipv4.sh
          git diff --check
          git add bootstrap/debian-ipv4.sh
          git commit -m 'Prevent silent success-probe bootstrap exits'

      - name: Push ordered commits
        run: git push origin HEAD:fix-silent-bootstrap-exit
