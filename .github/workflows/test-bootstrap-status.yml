name: Test bootstrap status semantics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  expected-absence:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate expected-absence probes
        run: |
          set -Eeuo pipefail

          bash -n bootstrap/debian-ipv4.sh
          source bootstrap/debian-ipv4.sh

          nft() {
            return 1
          }

          assert_nft_table_absent \
            inet \
            f2b-table \
            'Fixture table unexpectedly exists.'

          if (
            nft() {
              return 0
            }
            assert_nft_table_absent \
              inet \
              f2b-table \
              'Fixture table exists.'
          ); then
            echo 'Expected-present nftables fixture was accepted.' >&2
            exit 1
          fi

          awk '/^install_bootstrap_fail2ban\(\)/,/^\)/' \
            bootstrap/debian-ipv4.sh \
            | grep -F 'return 0'

          awk '/^verify_no_ufw\(\)/,/^}/' \
            bootstrap/debian-ipv4.sh \
            | grep -F 'return 0'

      - name: Validate finalize root contract
        run: |
          set -Eeuo pipefail

          finalize_section="$(
            awk \
              '/^## 7\. Run the `finalize` phase$/,/^## 8\./' \
              docs/bootstrap-from-zero.md
          )"

          sudo_line="$(
            grep -n -F 'sudo -i' <<<"${finalize_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"
          finalize_line="$(
            grep -n -F 'bash bootstrap/run.sh finalize' <<<"${finalize_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"

          [[ "${sudo_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Runbook does not document sudo -i before finalize.' >&2; exit 1; }
          [[ "${finalize_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Runbook finalize command is missing.' >&2; exit 1; }
          (( sudo_line < finalize_line )) \
            || { echo 'Runbook invokes finalize before entering a root shell.' >&2; exit 1; }

          main_section="$(
            awk '/^main\(\) \{$/,/^}/' bootstrap/debian-ipv4.sh
          )"
          require_root_line="$(
            grep -n -F 'require_root' <<<"${main_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"
          dispatch_line="$(
            grep -n -F 'case "${1:-}" in' <<<"${main_section}" \
              | head -n 1 \
              | cut -d: -f1 \
              || true
          )"

          [[ "${require_root_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Bootstrap entrypoint no longer requires root.' >&2; exit 1; }
          [[ "${dispatch_line}" =~ ^[0-9]+$ ]] \
            || { echo 'Bootstrap phase dispatch is missing.' >&2; exit 1; }
          (( require_root_line < dispatch_line )) \
            || { echo 'Bootstrap checks root only after phase dispatch.' >&2; exit 1; }

      - name: Validate readable bootstrap status contract
        run: |
          set -Eeuo pipefail

          bash -n bootstrap/debian-ipv4.sh

          status_section="$(
            awk '/^status\(\) \{$/,/^}/' bootstrap/debian-ipv4.sh
          )"
          verbose_section="$(
            awk '/^status_verbose\(\) \{$/,/^}/' bootstrap/debian-ipv4.sh
          )"
          status_doc="$(
            awk '/^## 9\. Run final verification$/,/^## 10\./' \
              docs/bootstrap-from-zero.md
          )"

          grep -F "status_check 'IPv4-only network state' ipv4" <<<"${status_section}"
          grep -F "status_check 'SSH configuration and listeners' ssh" <<<"${status_section}"
          grep -F "status_check 'nftables firewall and UFW removal' nftables" <<<"${status_section}"
          grep -F "status_check 'Fail2Ban configuration' fail2ban" <<<"${status_section}"
          grep -F "status_check 'Time synchronization and UDP 123' timesync" <<<"${status_section}"
          grep -F "printf 'Overall status: PASS\\n'" <<<"${status_section}"

          for raw_heading in \
            'IPv6 interface flags:' \
            'SSH effective configuration:' \
            'IPv4 listening sockets:' \
            'Fail2Ban:'; do
            if grep -F "${raw_heading}" <<<"${status_section}"; then
              echo "Compact status still contains raw section: ${raw_heading}" >&2
              exit 1
            fi
            grep -F "${raw_heading}" <<<"${verbose_section}"
          done

          grep -F 'status --verbose' bootstrap/debian-ipv4.sh
          grep -F 'Every row must begin with `[PASS]`' <<<"${status_doc}"
          grep -F 'Overall status: PASS' <<<"${status_doc}"
          grep -F 'status --verbose' <<<"${status_doc}"

      - name: Validate readable port audit contract
        run: |
          set -Eeuo pipefail

          audit_script='scripts/audit-ports.sh'
          bash -n "${audit_script}"

          for check_label in \
            'Public TCP listeners' \
            'Temporary SSH port' \
            'NTP server port' \
            'Public UDP listeners' \
            'IPv6 interface policy' \
            'IPv6 addresses' \
            'IPv6 routes' \
            'IPv6 listeners' \
            'nftables tables' \
            'Firewall default policy' \
            'Firewall TCP allowlist'; do
            grep -F "\"${check_label}\"" "${audit_script}"
          done

          grep -F 'fail_check() {' "${audit_script}"
          grep -F 'failures=$((failures + 1))' "${audit_script}"
          grep -F 'exit 1' "${audit_script}"
          grep -F "printf 'Port audit result: PASS\\n'" "${audit_script}"

          grep -F 'flags=(/proc/sys/net/ipv6/conf/*/disable_ipv6)' \
            "${audit_script}"
          grep -F 'enabled_ipv6_interfaces+=("${interface}: ${flag}=${value}")' \
            "${audit_script}"
          grep -F 'required_tables=(' "${audit_script}"
          grep -F 'required_tcp_ports=(22822 9330 9331 9332)' "${audit_script}"

          verbose_gate_line="$(
            grep -n -F 'if [[ "${verbose}" == "true" ]]; then' "${audit_script}" \
              | cut -d: -f1
          )"
          first_raw_line="$(
            grep -n -F 'print_verbose_section "IPv4 TCP listening sockets"' \
              "${audit_script}" \
              | cut -d: -f1
          )"
          [[ "${verbose_gate_line}" =~ ^[0-9]+$ ]]
          [[ "${first_raw_line}" =~ ^[0-9]+$ ]]
          (( verbose_gate_line < first_raw_line )) \
            || { echo 'Raw audit diagnostics are not gated by --verbose.' >&2; exit 1; }

          debian_audit_doc="$(
            awk '/^## 10\. Audit all listening ports$/,/^## 11\./' \
              docs/bootstrap-from-zero.md
          )"
          ubuntu_audit_doc="$(
            awk '/^## 10\. Run final verification and the local port audit$/,/^## 11\./' \
              docs/bootstrap-ubuntu-24.04-from-zero.md
          )"

          for audit_doc in "${debian_audit_doc}" "${ubuntu_audit_doc}"; do
            grep -F 'All 11 automated pass/fail checks must begin with `[PASS]`' \
              <<<"${audit_doc}"
            grep -F '`Checks passed` must report' <<<"${audit_doc}"
            grep -F 'Additional `[INFO]` rows may appear' <<<"${audit_doc}"
            grep -F './scripts/audit-ports.sh --verbose' <<<"${audit_doc}"
            grep -F '`Port audit result: PASS`' <<<"${audit_doc}"
          done
      - name: Validate compact APT lock output
        run: |
          set -Eeuo pipefail

          bash -n bootstrap/run.sh
          source bootstrap/run.sh

          success_fixture="$(mktemp)"
          error_fixture="$(mktemp)"
          trap 'rm -f "${success_fixture}" "${error_fixture}"' EXIT

          cat >"${success_fixture}" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' 'Waiting for cache lock: fixture lock holder' >&2
          sleep 2
          printf '%s\n' 'Waiting for cache lock: fixture lock holder' >&2
          printf '%s\n' 'Waiting for cache lock: fixture lock holder' >&2
          printf '%s\n' 'Reading package lists... Done'
          EOF
          chmod +x "${success_fixture}"

          output="$(
            APT_GET_BIN="${success_fixture}" \
            APT_LOCK_TIMEOUT_SECONDS=5 \
            APT_LOCK_PROGRESS_SECONDS=1 \
              apt-get update
          )"

          initial_count="$(
            awk '
              $0 == "==> Package manager is busy; waiting up to 5 seconds" {
                count++
              }
              END { print count + 0 }
            ' <<<"${output}"
          )"
          [[ "${initial_count}" -eq 1 ]] \
            || { echo 'APT lock wait announcement was not emitted exactly once.' >&2; exit 1; }

          grep -F '==> Still waiting for package manager lock (' <<<"${output}"
          grep -F 'Reading package lists... Done' <<<"${output}"

          if grep -F 'Waiting for cache lock:' <<<"${output}"; then
            echo 'Raw repeated APT lock diagnostics leaked into output.' >&2
            exit 1
          fi

          cat >"${error_fixture}" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' 'E: fixture package failure' >&2
          exit 42
          EOF
          chmod +x "${error_fixture}"

          set +e
          error_output="$(
            APT_GET_BIN="${error_fixture}" \
              apt-get update 2>&1
          )"
          error_status=$?
          set -e

          [[ "${error_status}" -eq 42 ]] \
            || { echo "APT exit status changed to ${error_status}; expected 42." >&2; exit 1; }
          grep -F 'E: fixture package failure' <<<"${error_output}"
